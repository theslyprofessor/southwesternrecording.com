server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik (TLS terminates upstream), nginx only sees plain http on
    # :80. Without this, its directory-redirect emits an absolute
    # "http://host/path/" Location, which downgrades the scheme and 404s —
    # so /internships (no trailing slash) broke while /internships/ worked.
    # Relative redirects keep the caller's scheme.
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
